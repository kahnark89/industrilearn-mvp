<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollowell Industries - Training Center</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary-600: #2563eb; --primary-700: #1d4ed8;
            --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-500: #6b7280;
            --gray-600: #4b5563; --gray-700: #374151; --gray-900: #111827; --white: #ffffff;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: var(--gray-900);
            background-color: var(--gray-50);
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Header */
        .app-header {
            background-color: var(--white);
            border-bottom: 1px solid var(--gray-200);
            padding: 16px 0;
            margin-bottom: 32px;
        }
        .header-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-logo {
            font-size: 28px;
        }
        .brand-text {
            font-size: 24px;
            font-weight: 800;
            color: var(--gray-900);
        }

        /* Main Views */
        .main-view {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .main-view.active {
            display: block;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .content-header {
            margin-bottom: 24px;
        }
        .page-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--gray-900);
        }
        .page-subtitle {
            font-size: 18px;
            color: var(--gray-600);
            margin-top: 4px;
        }

        /* Training Module Grid */
        .training-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        .module-card {
            background: var(--white);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            overflow: hidden;
        }
        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }
        .module-card-banner {
            height: 180px;
            background-color: var(--gray-700);
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .badge-3d {
            position: absolute; top: 10px; right: 10px;
            background: #1d4ed8; color: #fff;
            font-size: 10px; font-weight: 700; letter-spacing: 1px;
            padding: 3px 8px; border-radius: 4px; text-transform: uppercase;
        }
        .module-card-content {
            padding: 24px;
            flex-grow: 1;
        }
        .module-category {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-600);
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .module-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1.3;
        }
        
        /* Module Detail View */
        .module-detail-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--white);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-200);
        }
        @media (min-width: 768px) {
            .module-detail-container {
                padding: 48px;
            }
        }
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--gray-100);
            border: 1px solid var(--gray-200);
            color: var(--gray-700);
            text-decoration: none;
            font-weight: 500;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .back-button:hover {
            background: var(--gray-200);
            border-color: var(--gray-300);
        }
        .module-detail-content h3 {
            font-size: 24px;
            font-weight: 700;
            margin-top: 24px;
            margin-bottom: 16px;
        }
        .module-detail-content p {
            margin-bottom: 16px;
            line-height: 1.7;
            color: var(--gray-700);
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            border-radius: 12px;
            margin-top: 16px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="brand-logo">⚙️</div>
                <h1 class="brand-text">Hollowell Industries Training Center</h1>
            </div>
        </header>

        <main>
            <div id="module-list-view" class="main-view active">
                <div class="content-header">
                    <h2 class="page-title">Extrusion Line Training</h2>
                    <p class="page-subtitle">Select a module to begin your training. The content is tailored for Extruder Operators.</p>
                </div>
                <div id="training-grid-container" class="training-grid">
                    </div>
            </div>

            <div id="module-detail-view" class="main-view">
                </div>
        </main>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    // --- DATABASE ---
    // Simplified database focusing only on the training content.
    // The content is tailored to your work as an Extruder Operator.
    const trainingModules = [
        { 
            id: 1, 
            title: "Single-Screw Extruder Safety Procedures", 
            category: "Safety", 
            banner: 'https://images.unsplash.com/photo-1556742044-3c52d6e88c62?auto=format&fit=crop&w=800&q=60', 
            content: {
                summary: "This module covers critical safety checks, emergency stop procedures, and proper Personal Protective Equipment (PPE) for working with the 6-inch single-screw extruder.",
                video: "https://www.youtube.com/embed/dQw4w9WgXcQ" // Placeholder video
            }
        },
        { 
            id: 2, 
            title: "Breaker Plate & Screen Pack Changeout", 
            category: "Operations", 
            banner: 'https://images.unsplash.com/photo-1621999933580-1a1a70c48e4a?auto=format&fit=crop&w=800&q=60',
            content: {
                summary: "Learn the correct procedure for using the hydraulic piston ram to swap cartridge-style breaker plates. This guide focuses on ensuring minimal downtime, preventing leaks, and properly managing the two heat zones on the changer body."
            }
        },
        { 
            id: 3, 
            title: "Die and Cone Maintenance for PVC Sheeting", 
            category: "Maintenance", 
            banner: 'https://images.unsplash.com/photo-1581092448348-52cde2d07022?auto=format&fit=crop&w=800&q=60',
            content: {
                summary: "This module details the process for inspecting, cleaning, and re-installing the 80-inch coat hanger die and cone assembly. Proper maintenance here is critical for maintaining sheet quality and preventing material leaks at the die face."
            }
        },
        { 
            id: 4, 
            title: "Calibrating the 8 Barrel Heater Zones", 
            category: "Maintenance", 
            banner: 'https://images.unsplash.com/photo-1621905252039-953d19f42b36?auto=format&fit=crop&w=800&q=60',
            content: {
                summary: "A correct heat profile is key to quality extrusion. This module covers troubleshooting common heating issues across the 15-foot barrel and ensuring each of the 8 zones is within temperature specification."
            }
        },
        {
            id: 5,
            title: "Flexible Lip Adjustment for Thickness Control",
            category: "Quality Control",
            banner: 'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=800&q=60',
            content: {
                summary: "Learn the technique for using the adjusting screws (spaced 1-inch apart) on the flexible die lip to control the final thickness profile of the PVC sheet, ensuring it meets the 15-25 mil specification."
            }
        },
        {
            id: 6,
            title: "LE01 — 3D Extruder Digital Twin",
            category: "Interactive Tool",
            banner: 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&w=800&q=60',
            externalLink: 'extruder-digital-twin.html',
            content: {
                summary: "Explore an interactive 3D digital twin of the LE01 Johnson Plastics extrusion line. Adjust all 20 temperature zones, motor RPM, and amperage in real time and watch the 3D model react — color-coded heat zones, rotating screw, and live gauges."
            }
        }
    ];

    // --- DOM SELECTORS ---
    const moduleListView = document.getElementById('module-list-view');
    const moduleDetailView = document.getElementById('module-detail-view');
    const trainingGridContainer = document.getElementById('training-grid-container');

    // --- FUNCTIONS ---

    /**
     * Renders the list of all training modules on the main page.
     */
    function renderModuleList() {
        trainingGridContainer.innerHTML = ''; // Clear existing content
        trainingModules.forEach(module => {
            const card = document.createElement('div');
            card.className = 'module-card';
            card.dataset.moduleId = module.id; // Set data attribute to identify the module
            card.innerHTML = `
                <div class="module-card-banner" style="background-image: url('${module.banner}')">
                    ${module.externalLink ? '<div class="badge-3d">&#x25B6; Interactive 3D</div>' : ''}
                </div>
                <div class="module-card-content">
                    <div class="module-category">${module.category}</div>
                    <h3 class="module-title">${module.title}</h3>
                </div>
            `;
            trainingGridContainer.appendChild(card);
        });
    }

    /**
     * Renders the detailed content for a single selected module.
     * @param {number} moduleId - The ID of the module to display.
     */
    function renderModuleDetail(moduleId) {
        const module = trainingModules.find(m => m.id === moduleId);
        if (!module) return;

        let videoHTML = '';
        if (module.content.video) {
            videoHTML = `
                <div class="video-container">
                    <iframe src="${module.content.video}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>`;
        }

        moduleDetailView.innerHTML = `
            <div class="module-detail-container">
                <button class="back-button" id="back-to-list-btn">
                    <span style="font-size: 20px;">←</span> Back to All Modules
                </button>
                <div class="content-header">
                    <p class="module-category">${module.category}</p>
                    <h2 class="page-title">${module.title}</h2>
                </div>
                <div class="module-detail-content">
                    ${videoHTML}
                    <h3>Module Overview</h3>
                    <p>${module.content.summary}</p>
                </div>
            </div>
        `;

        // Switch views
        moduleListView.classList.remove('active');
        moduleDetailView.classList.add('active');
    }

    /**
     * Switches the view back to the main module list.
     */
    function showModuleList() {
        moduleDetailView.classList.remove('active');
        moduleListView.classList.add('active');
        moduleDetailView.innerHTML = ''; // Clean up detail view
    }

    // --- EVENT LISTENERS ---

    // Listen for clicks on the grid container.
    // This uses event delegation so we don't need an event listener for every card.
    trainingGridContainer.addEventListener('click', (e) => {
        const card = e.target.closest('.module-card');
        if (card) {
            const moduleId = parseInt(card.dataset.moduleId);
            const module = trainingModules.find(m => m.id === moduleId);
            if (module && module.externalLink) {
                window.location.href = module.externalLink;
            } else {
                renderModuleDetail(moduleId);
            }
        }
    });

    // Listen for clicks on the detail view, specifically for the back button.
    moduleDetailView.addEventListener('click', (e) => {
        if (e.target.closest('#back-to-list-btn')) {
            showModuleList();
        }
    });

    // --- INITIALIZATION ---
    // Render the initial list of modules when the page loads.
    renderModuleList();

});
</script>

</body>
</html>
